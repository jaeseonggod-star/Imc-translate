<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC 실시간 음성 번역</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FDFBF7;
            color: #1A2B4C;
        }
        
        .custom-shadow {
            box-shadow: 0 4px 20px rgba(26, 43, 76, 0.05);
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen p-3 md:p-8 flex flex-col items-center bg-[#FDFBF7]">

    <div id="error-message" class="hidden w-full max-w-6xl bg-red-100 text-red-700 p-3 md:p-4 rounded-lg mb-4 text-center font-medium text-sm md:text-base"></div>

    <header class="w-full max-w-6xl text-center mb-5 md:mb-8 mt-2 md:mt-4">
        <h1 class="text-2xl md:text-4xl font-bold text-[#1A2B4C] mb-2 tracking-tight">IMC 실시간 음성 번역</h1>
        <p class="text-gray-500 text-xs md:text-base px-2">언어를 선택하고 마이크를 향해 말씀해 주세요. (20문장 초과 시 자동 리셋)</p>
    </header>

    <div class="w-full max-w-6xl flex flex-col lg:flex-row items-center justify-between bg-white p-4 md:p-6 rounded-2xl custom-shadow mb-6 md:mb-8 border border-gray-100 gap-4 lg:gap-0">
        
        <div class="flex items-center space-x-2 w-full lg:w-auto justify-center lg:justify-start bg-gray-50 lg:bg-transparent py-3 rounded-lg lg:py-0 px-4">
            <div id="status-indicator" class="w-3 h-3 rounded-full bg-gray-300"></div>
            <span id="status-text" class="text-gray-600 font-medium text-sm md:text-base whitespace-nowrap">대기 중</span>
            <span id="sentence-counter" class="ml-3 text-xs bg-gray-200 text-gray-500 px-2 py-1 rounded-full font-bold">0/20</span>
        </div>
        
        <div class="flex flex-col md:flex-row items-center space-y-3 md:space-y-0 md:space-x-4 w-full lg:w-auto">
            
            <div class="flex w-full md:w-auto space-x-2">
                <select id="source-lang" class="w-full appearance-none bg-gray-50 border border-gray-200 text-[#1A2B4C] py-3 pl-4 pr-8 rounded-xl font-medium text-sm focus:outline-none focus:ring-2 focus:ring-[#1A2B4C] cursor-pointer">
                    <option value="ko-KR" data-short="ko" data-name="한국어">입력: 한국어</option>
                    <option value="en-US" data-short="en" data-name="영어">입력: 영어</option>
                    <option value="zh-CN" data-short="zh-CN" data-name="중국어">입력: 중국어</option>
                    <option value="ja-JP" data-short="ja" data-name="일본어">입력: 일본어</option>
                    <option value="vi-VN" data-short="vi" data-name="베트남어">입력: 베트남어</option>
                    <option value="es-ES" data-short="es" data-name="스페인어">입력: 스페인어</option>
                    <option value="fr-FR" data-short="fr" data-name="프랑스어">입력: 프랑스어</option>
                    <option value="pt-BR" data-short="pt" data-name="포르투갈어">입력: 포르투갈어</option>
                    <option value="ar-SA" data-short="ar" data-name="아랍어">입력: 아랍어</option>
                </select>

                <div class="flex items-center text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </div>

                <select id="target-lang" class="w-full appearance-none bg-blue-50 border border-blue-200 text-blue-900 py-3 pl-4 pr-8 rounded-xl font-bold text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                    <option value="en" data-name="영어">번역: 영어</option>
                    <option value="ko" data-name="한국어">번역: 한국어</option>
                    <option value="zh-CN" data-name="중국어">번역: 중국어</option>
                    <option value="ja" data-name="일본어">번역: 일본어</option>
                    <option value="vi" data-name="베트남어">번역: 베트남어</option>
                    <option value="es" data-name="스페인어">번역: 스페인어</option>
                    <option value="fr" data-name="프랑스어">번역: 프랑스어</option>
                    <option value="pt" data-name="포르투갈어">번역: 포르투갈어</option>
                    <option value="ar" data-name="아랍어">번역: 아랍어</option>
                </select>
            </div>

            <div class="flex space-x-2 w-full md:w-auto justify-center">
                <button id="start-btn" class="bg-[#1A2B4C] hover:bg-[#2A406D] text-white px-6 py-3 rounded-xl font-medium transition-all duration-300 flex items-center justify-center space-x-2 flex-1 md:flex-none text-sm shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
                    <span>켜기</span>
                </button>
                <button id="stop-btn" disabled class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-3 rounded-xl font-medium transition-all duration-300 flex items-center justify-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed flex-1 md:flex-none text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" /></svg>
                    <span>중지</span>
                </button>
            </div>
        </div>
    </div>

    <main class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-5 gap-4 md:gap-6 pb-8">
        
        <!-- 원본 언어 인식 창 (가로 비율 2) -->
        <div class="md:col-span-2 bg-white rounded-2xl custom-shadow border border-gray-100 flex flex-col h-[35vh] md:h-[60vh]">
            <div class="p-3 md:p-4 border-b border-gray-100 bg-gray-50/50 rounded-t-2xl flex justify-between items-center">
                <h2 class="text-base font-bold text-[#1A2B4C] flex items-center">
                    <span id="src-title">원본 (한국어)</span>
                </h2>
                <button id="clear-btn" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-600 px-3 py-1 rounded transition-colors">지우기</button>
            </div>
            <div id="src-container" class="p-4 md:p-6 flex-1 overflow-y-auto text-base leading-relaxed text-gray-700 scrollbar-hide transition-opacity duration-300">
                <div id="src-final-text" class="inline"></div>
                <div id="src-interim-text" class="inline text-gray-400 italic"></div>
            </div>
        </div>

        <!-- 번역 결과 창 (가로 비율 3: 더 넓게) -->
        <div class="md:col-span-3 bg-white rounded-2xl custom-shadow border border-blue-100 flex flex-col h-[40vh] md:h-[60vh]">
            <div class="p-3 md:p-4 border-b border-blue-900 bg-[#1A2B4C] rounded-t-2xl text-white flex justify-between items-center">
                <h2 class="text-base md:text-lg font-bold flex items-center">
                    <span id="trans-title" class="text-blue-300">영어</span> <span class="ml-1">번역 결과</span>
                </h2>
                <button id="copy-btn" class="text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-1 rounded transition-colors">복사하기</button>
            </div>
            <div id="tgt-container" class="p-4 md:p-6 flex-1 overflow-y-auto text-lg md:text-xl font-medium leading-relaxed text-gray-900 scrollbar-hide bg-gray-50/30 transition-opacity duration-300">
                <div id="tgt-final-text"></div>
                <div id="translating-indicator" class="hidden mt-4 text-xs md:text-sm text-blue-500 animate-pulse border-l-2 border-blue-500 pl-2">실시간 번역 중...</div>
            </div>
        </div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        /* =========================================================
         *  IMC 실시간 음성 번역 - 엔진
         *
         *  [중복 인식 문제의 원인]
         *  안드로이드 크롬은 한 문장을 말하는 동안 isFinal 결과를 여러 번
         *  던지는데, 매번 "지금까지 말한 문장 전체"를 다시 보낸다.
         *      final #1 : "안녕하십니까"
         *      final #2 : "안녕하십니까 저는"
         *      final #3 : "안녕하십니까 저는 김재성이라고 합니다"
         *  기존 코드는 이걸 받을 때마다 화면에 append 했기 때문에
         *  한 번 말한 문장이 10~20문장으로 불어났다.
         *
         *  [해결 구조] "한 세션 = 한 문장" 커밋 방식
         *   1. 결과가 오면 화면에 붙이지 않고 세션 버퍼에 '병합(merge)'만 한다.
         *   2. 세션이 끝날 때(onend) 버퍼를 딱 한 번만 화면에 커밋 + 번역 1회.
         *   3. 세션 간 재생(replay) 대비 2차 중복 차단 장치를 둔다.
         *  => 구조적으로 중복이 생길 경로가 없다.
         * ========================================================= */

        const $ = (id) => document.getElementById(id);

        const startBtn   = $('start-btn');
        const stopBtn    = $('stop-btn');
        const copyBtn    = $('copy-btn');
        const clearBtn   = $('clear-btn');

        const statusIndicator = $('status-indicator');
        const statusText      = $('status-text');
        const sentenceCounter = $('sentence-counter');

        const srcFinalText   = $('src-final-text');
        const srcInterimText = $('src-interim-text');
        const tgtFinalText   = $('tgt-final-text');

        const translatingIndicator = $('translating-indicator');
        const srcContainer = $('src-container');
        const tgtContainer = $('tgt-container');
        const errorMessage = $('error-message');

        const sourceLangSelect = $('source-lang');
        const targetLangSelect = $('target-lang');
        const srcTitle   = $('src-title');
        const transTitle = $('trans-title');

        /* ---------------- 설정값 ---------------- */
        const MAX_SENTENCES   = 20;
        const RESTART_DELAY   = 300;   // onend 후 재시작 대기 (50ms는 안드로이드에서 실패함)
        const WATCHDOG_MS     = 1500;  // 마이크가 조용히 죽었을 때 자동 복구 주기
        const IDLE_COMMIT_MS  = 2200;  // 세션이 안 끊길 때 문장 확정 보조 타이머
        const DUP_EXACT_MS    = 1500;  // 완전 동일 문장 중복 차단 창
        const DUP_PREFIX_MS   = 3000;  // 이전 문장으로 시작하는 재생 차단 창
        const FETCH_TIMEOUT   = 7000;

        /* ---------------- 상태값 ---------------- */
        let recognition   = null;
        let shouldListen  = false;   // 사용자가 '켜기'를 누른 상태인가
        let isRecording   = false;   // 현재 세션이 살아있는가
        let isStarting    = false;   // start() 호출 후 onstart 대기중인가

        let sessionText     = '';    // 현재 세션에서 병합된 전체 발화
        let committedPrefix = '';    // 그중 이미 화면에 커밋된 부분
        let seenFinals      = new Map(); // 인덱스별 마지막 final 값 (중복 병합 방지)

        let lastPushed   = '';       // 직전에 화면에 올린 문장 (세션 간 중복 차단용)
        let lastPushedAt = 0;

        let sentencesCount = 0;
        let resetScheduled = false;
        let pendingTranslations = 0;

        let idleTimer = null, restartTimer = null, watchdogTimer = null;

        /* =========================================================
         *  문자열 병합 유틸 - 중복 제거의 핵심
         * ========================================================= */
        const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();

        function commonPrefixLen(a, b) {
            const n = Math.min(a.length, b.length);
            let i = 0;
            while (i < n && a[i] === b[i]) i++;
            return i;
        }

        // a의 끝과 b의 앞이 겹치는 최대 길이 (3자 이상만 인정)
        function tailOverlapLen(a, b) {
            const max = Math.min(a.length, b.length);
            for (let k = max; k >= 3; k--) {
                if (a.endsWith(b.slice(0, k))) return k;
            }
            return 0;
        }

        // cur(누적 발화)에 inc(새로 들어온 결과)를 안전하게 합친다.
        function merge(cur, inc) {
            cur = norm(cur);
            inc = norm(inc);
            if (!inc) return cur;
            if (!cur) return inc;
            if (inc === cur) return cur;                 // 똑같은 결과 재전송
            if (inc.startsWith(cur)) return inc;         // 누적 성장형 (안드로이드 핵심 케이스)
            if (cur.startsWith(inc)) return cur;         // 뒤늦게 온 짧은 결과
            if (cur.includes(inc)) return cur;           // 이미 포함된 조각

            // 앞부분이 대부분 같으면 = 같은 발화를 엔진이 수정한 것 → 교체
            const minLen = Math.min(cur.length, inc.length);
            const cp = commonPrefixLen(cur, inc);
            if (minLen >= 4 && cp / minLen >= 0.6) {
                return inc.length >= cur.length ? inc : cur;
            }

            // 꼬리-머리가 겹치면 겹친 만큼만 잘라 이어붙임
            const ov = tailOverlapLen(cur, inc);
            if (ov > 0 && inc.length > ov) return norm(cur + inc.slice(ov));

            return norm(cur + ' ' + inc);                // 진짜 새 내용
        }

        // 세션 텍스트 중 아직 화면에 안 올라간 부분만 추출
        function pendingOf(full) {
            full = norm(full);
            if (!committedPrefix) return full;
            if (full === committedPrefix) return '';
            if (full.startsWith(committedPrefix)) return norm(full.slice(committedPrefix.length));
            const cp = commonPrefixLen(committedPrefix, full);
            if (cp >= committedPrefix.length * 0.6) return norm(full.slice(cp));
            return full;
        }

        /* =========================================================
         *  음성 인식 준비
         * ========================================================= */
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SR) {
            showError('이 브라우저는 음성 인식을 지원하지 않습니다. 안드로이드 크롬으로 접속해 주세요.');
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50');
        } else {
            recognition = new SR();
            // continuous=false : 한 발화가 끝나면 세션이 스스로 종료 → 그 시점이 문장 경계
            recognition.continuous     = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecording = true;
                isStarting  = false;
                resetSessionBuffer();
                setListeningUI();
            };

            recognition.onresult = (event) => {
                // resultIndex는 안드로이드에서 항상 0으로 오는 등 신뢰할 수 없으므로 쓰지 않는다.
                let interim = '';
                for (let i = 0; i < event.results.length; i++) {
                    const res = event.results[i];
                    const text = norm(res[0] ? res[0].transcript : '');
                    if (!text) continue;

                    if (res.isFinal) {
                        if (seenFinals.get(i) === text) continue; // 같은 인덱스 재전송 → 무시
                        seenFinals.set(i, text);
                        sessionText = merge(sessionText, text);
                    } else {
                        interim = merge(interim, text);
                    }
                }

                // 미확정 텍스트는 세션 버퍼를 오염시키지 않고 화면 표시용으로만 합침
                const live = interim ? merge(sessionText, interim) : sessionText;
                srcInterimText.textContent = pendingOf(live);
                scrollToBottom(srcContainer);

                // 세션이 오래 안 끊기는 기기 대비 보조 확정 타이머
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    if (isRecording) commitSession();
                }, IDLE_COMMIT_MS);
            };

            recognition.onerror = (event) => {
                const err = event.error;
                if (err === 'not-allowed' || err === 'service-not-allowed') {
                    showError('마이크 권한이 차단되었습니다. 주소가 https:// 로 시작하는지, 그리고 브라우저 사이트 설정에서 마이크가 허용인지 확인해 주세요.');
                    shouldListen = false;
                } else if (err === 'network') {
                    showError('네트워크가 불안정합니다. 연결을 확인해 주세요. (자동으로 다시 시도합니다)');
                }
                // no-speech, aborted, audio-capture 등은 정상적인 흐름 → onend에서 자동 재시작
            };

            recognition.onend = () => {
                isRecording = false;
                isStarting  = false;
                clearTimeout(idleTimer);

                commitSession();       // 이 세션의 문장을 '단 한 번' 확정
                resetSessionBuffer();

                if (shouldListen) {
                    clearTimeout(restartTimer);
                    restartTimer = setTimeout(safeStart, RESTART_DELAY);
                } else {
                    resetUIState();
                }
            };
        }

        /* =========================================================
         *  문장 확정 & 화면 반영
         * ========================================================= */
        function resetSessionBuffer() {
            sessionText = '';
            committedPrefix = '';
            seenFinals = new Map();
            srcInterimText.textContent = '';
        }

        function commitSession() {
            const pending = pendingOf(sessionText);
            committedPrefix = sessionText;
            srcInterimText.textContent = '';
            if (pending) pushSentence(pending);
        }

        function pushSentence(raw) {
            let text = norm(raw);
            if (!text) return;

            const now = Date.now();

            // 2차 중복 차단: 마이크 재시작 직후 같은 발화가 다시 들어오는 경우
            if (lastPushed) {
                if (text === lastPushed && (now - lastPushedAt) < DUP_EXACT_MS) return;
                if (text.length > lastPushed.length &&
                    text.startsWith(lastPushed) &&
                    (now - lastPushedAt) < DUP_PREFIX_MS) {
                    text = norm(text.slice(lastPushed.length));
                    if (!text) return;
                }
            }

            lastPushed   = norm(raw);
            lastPushedAt = now;

            const span = document.createElement('span');
            span.textContent = text + ' ';
            srcFinalText.appendChild(span);
            scrollToBottom(srcContainer);

            // 번역 순서가 뒤바뀌지 않도록 자리를 먼저 만들고 나중에 채운다
            const slot = createTranslationSlot();
            translateText(text, slot);

            updateSentenceCount(1);
        }

        /* =========================================================
         *  마이크 제어
         * ========================================================= */
        function safeStart() {
            if (!recognition || !shouldListen || isRecording || isStarting) return;
            isStarting = true;
            try {
                recognition.lang = sourceLangSelect.value;
                recognition.start();
            } catch (e) {
                isStarting = false; // 워치독이 다시 시도한다
            }
        }

        async function ensureMicPermission() {
            // 권한을 먼저 확보하고 즉시 트랙을 놓아준다 → 모바일 권한 프롬프트/알림음 반복 감소
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(t => t.stop());
                await new Promise(r => setTimeout(r, 150));
            } catch (e) {
                /* 권한 실패는 recognition.onerror에서 안내 */
            }
        }

        async function startListening() {
            if (!recognition || shouldListen) return;
            shouldListen = true;
            errorMessage.classList.add('hidden');
            setListeningUI();
            await ensureMicPermission();
            safeStart();
        }

        function stopListening() {
            shouldListen = false;
            clearTimeout(restartTimer);
            clearTimeout(idleTimer);
            commitSession();
            resetSessionBuffer();
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
                try { recognition.abort(); } catch (e) {}
            }
            resetUIState();
        }

        // 워치독: 켜져 있어야 하는데 죽어 있으면 되살린다
        watchdogTimer = setInterval(() => {
            if (shouldListen && !isRecording && !isStarting) safeStart();
        }, WATCHDOG_MS);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && shouldListen && !isRecording && !isStarting) safeStart();
        });

        window.addEventListener('pagehide', () => {
            clearInterval(watchdogTimer);
            if (recognition) { try { recognition.abort(); } catch (e) {} }
        });

        /* =========================================================
         *  UI
         * ========================================================= */
        function setListeningUI() {
            statusIndicator.classList.remove('bg-gray-300', 'bg-red-500');
            statusIndicator.classList.add('bg-green-500', 'animate-pulse');
            statusText.textContent = '듣고 있습니다...';
            statusText.classList.add('text-green-600');
            startBtn.disabled = true;  stopBtn.disabled = false;
            startBtn.classList.add('opacity-50'); stopBtn.classList.remove('opacity-50');
        }

        function resetUIState() {
            isRecording = false;
            statusIndicator.classList.remove('bg-green-500', 'animate-pulse');
            statusIndicator.classList.add('bg-gray-300');
            statusText.textContent = '대기 중';
            statusText.classList.remove('text-green-600');
            startBtn.disabled = false; stopBtn.disabled = true;
            startBtn.classList.remove('opacity-50'); stopBtn.classList.add('opacity-50');
            srcInterimText.textContent = '';
        }

        function updateSentenceCount(count) {
            sentencesCount += count;
            sentenceCounter.textContent = `${sentencesCount}/${MAX_SENTENCES}`;
            if (sentencesCount >= MAX_SENTENCES && !resetScheduled) {
                resetScheduled = true;
                setTimeout(() => resetScreens(), 2500);
            }
        }

        function resetScreens() {
            srcContainer.style.opacity = '0';
            tgtContainer.style.opacity = '0';
            setTimeout(() => {
                srcFinalText.innerHTML = '';
                tgtFinalText.innerHTML = '';
                srcInterimText.textContent = '';
                sentencesCount = 0;
                sentenceCounter.textContent = `0/${MAX_SENTENCES}`;
                resetScheduled = false;
                lastPushed = '';
                lastPushedAt = 0;
                committedPrefix = sessionText; // 이미 지나간 음성이 다시 올라오지 않도록
                srcContainer.style.opacity = '1';
                tgtContainer.style.opacity = '1';
            }, 300);
        }

        function scrollToBottom(el) { el.scrollTop = el.scrollHeight; }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
        }

        /* =========================================================
         *  번역
         * ========================================================= */
        function createTranslationSlot() {
            const p = document.createElement('p');
            p.className = 'mb-4 border-b border-gray-200/50 pb-3 break-keep';
            p.textContent = '···';
            p.style.opacity = '0.4';
            tgtFinalText.appendChild(p);
            scrollToBottom(tgtContainer);
            return p;
        }

        function fillSlot(slot, text) {
            slot.textContent = text;
            slot.style.opacity = '1';
            scrollToBottom(tgtContainer);
        }

        async function fetchJSON(url) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);
            try {
                const res = await fetch(url, { signal: ctrl.signal });
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function translateText(text, slot) {
            const srcOpt = sourceLangSelect.options[sourceLangSelect.selectedIndex];
            const tgtOpt = targetLangSelect.options[targetLangSelect.selectedIndex];
            const src = srcOpt.dataset.short || sourceLangSelect.value;
            const tgt = tgtOpt.dataset.short || targetLangSelect.value;

            if (src === tgt) { fillSlot(slot, text); return; }

            pendingTranslations++;
            translatingIndicator.classList.remove('hidden');

            try {
                // 1차: MyMemory
                try {
                    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|${tgt}&de=imcdemo@example.com`;
                    const data = await fetchJSON(url);
                    const out = data && data.responseData ? data.responseData.translatedText : '';
                    const ok = out && Number(data.responseStatus) === 200 && !/^[A-Z '.,]+$/.test(out);
                    if (ok) { fillSlot(slot, out); return; }
                } catch (e) { /* 2차로 넘어감 */ }

                // 2차: 폴백
                const url2 = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${src}&tl=${tgt}&dt=t&q=${encodeURIComponent(text)}`;
                const data2 = await fetchJSON(url2);
                const out2 = Array.isArray(data2) && Array.isArray(data2[0])
                    ? data2[0].map(seg => (seg && seg[0]) ? seg[0] : '').join('')
                    : '';
                fillSlot(slot, out2 || text);
            } catch (e) {
                fillSlot(slot, text); // 실패해도 원문은 남긴다
            } finally {
                pendingTranslations = Math.max(0, pendingTranslations - 1);
                if (pendingTranslations === 0) translatingIndicator.classList.add('hidden');
            }
        }

        /* =========================================================
         *  이벤트 바인딩
         * ========================================================= */
        startBtn.addEventListener('click', startListening);
        stopBtn.addEventListener('click', stopListening);
        clearBtn.addEventListener('click', () => resetScreens());

        copyBtn.addEventListener('click', async () => {
            const text = tgtFinalText.innerText.trim();
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            copyBtn.textContent = '복사 완료!';
            setTimeout(() => copyBtn.textContent = '복사하기', 2000);
        });

        sourceLangSelect.addEventListener('change', (e) => {
            const opt = e.target.options[e.target.selectedIndex];
            srcTitle.textContent = `원본 (${opt.dataset.name})`;
            if (shouldListen) {
                // 현재까지의 발화를 확정한 뒤 세션만 끊는다 → onend가 새 언어로 자동 재시작
                clearTimeout(idleTimer);
                commitSession();
                resetSessionBuffer();
                if (recognition) { try { recognition.abort(); } catch (err) {} }
            }
        });

        targetLangSelect.addEventListener('change', (e) => {
            transTitle.textContent = e.target.options[e.target.selectedIndex].dataset.name;
        });
    });
    </script>
</body>
</html>
